<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictation App</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.8.0",
          "marked": "https://esm.sh/marked@^4.0.0"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-container">
      <div class="main-content">
        <div class="note-area">
          <div class="note-header">
            <div
              class="editor-title"
              contenteditable="true"
              placeholder="Untitled Note"
              data-i18n-placeholder="untitledNote"
            >
              Untitled Note
            </div>
            <div class="header-controls">
              <div class="tab-navigation-container">
                <div class="tab-navigation">
                  <button class="tab-button active" data-tab="polished" data-i18n="polishedTab">Polished</button>
                  <button class="tab-button" data-tab="raw" data-i18n="rawTab">Raw</button>
                  <div class="active-tab-indicator"></div>
                </div>
              </div>
              <button id="shareButton" class="header-share-button" data-i18n-title="share">
                <i class="fas fa-arrow-up-from-bracket"></i>
                <span data-i18n="share">Share</span>
              </button>
              <button id="downloadButton" class="header-share-button" data-i18n-title="downloadNoteTitle">
                <i class="fas fa-download"></i>
                <span data-i18n="downloadNote">Download</span>
              </button>
              <button id="downloadAnalyzedButton" class="header-share-button" data-i18n-title="downloadAnalyzedNoteTitle">
                <i class="fas fa-microchip"></i>
                <span data-i18n="downloadAnalyzedNote">Download with Analysis</span>
              </button>
            </div>
          </div>

          <div class="note-content-wrapper">
            <div
              id="polishedNote"
              class="note-content active"
              contenteditable="true"
              placeholder="Your polished notes will appear here..."
              data-i18n-placeholder="polishedPlaceholder"
            ></div>
            <div
              id="rawTranscription"
              class="note-content"
              contenteditable="true"
              placeholder="Raw transcription will appear here..."
              data-i18n-placeholder="rawPlaceholder"
            ></div>
            <div class="note-actions hidden">
              <button id="summarizeButton" class="note-action-button" data-i18n="summarize">Summarize</button>
              <button id="analyzeButton" class="note-action-button" data-i18n="analyzeTopic">Analyze Topic</button>
              <button id="regenerateButton" class="note-action-button" data-i18n="regenerate">Regenerate</button>
            </div>
            <div id="analysisResult" class="analysis-container hidden"></div>
          </div>
        </div>

        <div class="recording-interface">
          <div id="liveRecordingTitle" class="live-recording-title" style="display: none">
            Recording
          </div>
          <canvas id="liveWaveformCanvas" style="display: none"></canvas>
          <div id="liveRecordingTimerDisplay" class="live-recording-timer" style="display: none">
            00:00.00
          </div>

          <div class="status-indicator">
            <div id="micStatusIndicator" class="mic-status hidden">
              <i class="fas"></i>
              <span id="micStatusText"></span>
            </div>
            <span id="recordingStatus" class="status-text">Ready to record</span>
          </div>

          <div class="recording-controls">
            <button class="action-button" id="themeToggleButton" title="Toggle Theme" data-i18n-title="toggleTheme">
              <i class="fas fa-sun"></i>
            </button>
            
            <div class="language-selector">
              <button class="action-button" id="languageToggleButton" title="Change Language" data-i18n-title="toggleLanguage">
                <i class="fas fa-globe"></i>
              </button>
              <div id="languageMenu" class="language-menu">
                <button class="language-option" data-lang="en">English</button>
                <button class="language-option" data-lang="lt">Lietuvių</button>
                <button class="language-option" data-lang="ru">Русский</button>
              </div>
            </div>

            <button id="recordButton" class="record-button">
              <div class="record-button-inner">
                <i class="fas fa-microphone"></i>
              </div>
              <svg class="record-waves" viewBox="0 0 200 200">
                <circle class="wave wave1" cx="100" cy="100" r="40" />
                <circle class="wave wave2" cx="100" cy="100" r="70" />
                <circle class="wave wave3" cx="100" cy="100" r="100" />
              </svg>
              <span class="record-text" data-i18n="recordText">Record</span>
            </button>

            <button class="action-button" id="newButton" title="New Note / Clear" data-i18n-title="newNote">
              <i class="fas fa-file"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="micStatus" class="debug-panel"></div>

  <script type="module" src="/index.tsx"></script>
</body>
</html>
